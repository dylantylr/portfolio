name = "dylan-recruiter-assistant"
main = "src/index.js"
compatibility_date = "2026-08-01"

# GEMINI_API_KEY is a secret, never put it here.
#   npx wrangler secret put GEMINI_API_KEY
#
# Optional per-IP rate limiting. Create the namespace, then uncomment:
#   npx wrangler kv namespace create RATE_LIMIT
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "paste-the-id-wrangler-prints"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
